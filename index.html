const LEVELS=[{icon:"🍎",name:"接蘋果 PLUS",goal:"用真正的 Python 控制籃子、蘋果與炸彈。12 分過關。",tasks:["← → 控制 basket","apple 往下掉","接到 apple：+1 分並隨機重生","漏接：-1 生命","碰到 bomb：-2 生命"],lesson:`<b>今天學：x / y、if、+=、random</b><pre>if key.right:\n    basket.x += 8\n\napple.y += 5\nscore += 1</pre><p><code>x</code> 控制左右；<code>y</code> 控制上下。Python 的 <code>if</code> 後面要有 <code>:</code>，裡面的程式要縮排。</p>`,hints:["先只完成左右移動。右邊讓 x 增加，左邊讓 x 減少。",`骨架：<pre>if key.right:\n    basket.x += 8\nif key.left:\n    basket.x -= 8</pre>`,`接到蘋果可以這樣開始：<pre>if basket.touched(apple):\n    score += 1\n    apple.y = -30</pre>再想想 apple.x 怎麼隨機。`],starter:`import random\n\nscore = 0\nlife = 5\n\ndef loop():\n    global score, life\n\n    # 1. 左右移動\n    pass\n\n    # 2. 蘋果往下\n    pass\n\n    # 3. 接到蘋果\n    if basket.touched(apple):\n        pass\n\n    # 4. 漏接蘋果\n    if apple.y > 400:\n        pass\n\n    # 5. 炸彈也會往下\n    bomb.y += 7\n\n    if basket.touched(bomb):\n        pass\n\n    if bomb.y > 420:\n        bomb.y = -160\n        bomb.x = random.randrange(20, 480)\n`,setup:`basket=Sprite(235,350,44,22)\napple=Sprite(160,-30,26,26)\nbomb=Sprite(360,-180,26,26)`,engine:`def __engine_step():\n    loop()\n    basket.x=max(0,min(476,basket.x))\ndef __state():\n    return json.dumps({"basket":[basket.x,basket.y],"apple":[apple.x,apple.y],"bomb":[bomb.x,bomb.y],"score":score,"life":life})`},{icon:"🚗",name:"閃避賽車",goal:"這次真的由你的 Python 決定敵車怎麼動、撞到是否扣血。",tasks:["控制 car","update_enemy(enemy) 讓車往下","跑出畫面後重生","撞到扣生命","修掉故意的 life += 1 Bug"],lesson:`<b>今天學：函式 def 與 Bug</b><pre>def update_enemy(enemy):\n    enemy.y += 5</pre><p>函式就是把一件工作包起來。Bug 不一定會讓 Python 報錯，有時程式能跑，但規則寫反。</p>`,hints:["先找最明顯的 Bug：撞到敵車應該讓 life 增加還是減少？",`敵車往下：<pre>enemy.y += enemy_speed</pre>`,`跑到底部時：把 enemy.y 放回負數，再讓 enemy.x = random.randrange(...)。`],starter:`import random\n\nlife = 3\nenemy_speed = 5\n\ndef update_player():\n    if key.right:\n        car.x += 8\n    if key.left:\n        car.x -= 8\n\ndef update_enemy(enemy):\n    # 讓敵車往下，跑出去就重生\n    pass\n\ndef hit_check(enemy):\n    global life\n    if car.touched(enemy):\n        # 🐛 故意的 Bug\n        life += 1\n        enemy.y = -80\n`,setup:`car=Sprite(235,335,44,50)\nenemies=[Sprite(80,-40,42,54),Sprite(250,-180,42,54),Sprite(410,-320,42,54)]`,engine:`def __engine_step():\n    update_player()\n    car.x=max(0,min(476,car.x))\n    for enemy in enemies:\n        update_enemy(enemy)\n        hit_check(enemy)\ndef __state():\n    return json.dumps({"car":[car.x,car.y],"enemies":[[e.x,e.y] for e in enemies],"life":life})`},{icon:"👾",name:"太空射擊",goal:"讓你的 Python 真正控制飛船與子彈。打中 10 隻外星人過關。",tasks:["ship 左右移動","Space 發射 bullet","bullet 往上","打中 alien +1","alien 隨機重生"],lesson:`<b>今天學：把遊戲拆成很多小函式</b><pre>def move_bullet():\n    bullet.y -= 8</pre><p>畫面上方的 y 比較小，所以往上通常是 y 減少。</p>`,hints:["先完成 move_ship()。跟第一關的 basket 幾乎一樣。",`子彈往上：<pre>bullet.y -= 10</pre>`,`發射時把 bullet.x 設成 ship.x 附近、bullet.y 設成 ship.y；打中時 score += 1。`],starter:`import random\n\nscore = 0\n\ndef move_ship():\n    pass\n\ndef move_bullet():\n    pass\n\ndef shoot():\n    if key.space:\n        pass\n\ndef hit_alien():\n    global score\n    if bullet.touched(alien):\n        pass\n`,setup:`ship=Sprite(235,350,42,32)\nbullet=Sprite(-100,-100,6,14)\nalien=Sprite(240,50,38,28)`,engine:`def __engine_step():\n    move_ship()\n    move_bullet()\n    shoot()\n    hit_alien()\n    ship.x=max(0,min(478,ship.x))\ndef __state():\n    return json.dumps({"ship":[ship.x,ship.y],"bullet":[bullet.x,bullet.y],"alien":[alien.x,alien.y],"score":score})`},{icon:"🧱",name:"打磚塊",goal:"球的位置與反彈全部由你的 Python 控制。打掉全部磚塊。",tasks:["ball.x/y 加上 vx/vy","碰左右牆反轉 vx","碰上牆反轉 vy","碰 paddle 反轉 vy","碰 brick 得分並隱藏"],lesson:`<b>今天學：速度 vx / vy</b><pre>ball.x += ball_vx\nball.y += ball_vy\n\nball_vx *= -1</pre><p>乘上 -1 就會把方向反過來：4 → -4。</p>`,hints:["move_ball() 需要兩行：x 加 vx，y 加 vy。","反彈可以用 *= -1。","brick.hidden = True 可以讓磚塊消失；別忘記 score += 1。"],starter:`score = 0\nball_vx = 4\nball_vy = -4\n\ndef move_ball():\n    global ball_vx, ball_vy\n    pass\n\ndef wall_check():\n    global ball_vx, ball_vy\n    if ball.x < 0 or ball.x > 510:\n        pass\n    if ball.y < 0:\n        pass\n\ndef paddle_check():\n    global ball_vy\n    if ball.touched(paddle) and ball_vy > 0:\n        pass\n\ndef brick_check(brick):\n    global score, ball_vy\n    if not brick.hidden and ball.touched(brick):\n        pass\n`,setup:`ball=Sprite(260,250,14,14)\npaddle=Sprite(210,365,100,16)\nbricks=[]\nfor r in range(4):\n    for c in range(8):\n        bricks.append(Sprite(24+c*60,45+r*28,52,18))`,engine:`def __engine_step():\n    move_ball()\n    wall_check()\n    paddle_check()\n    for brick in bricks:\n        brick_check(brick)\ndef __state():\n    return json.dumps({"ball":[ball.x,ball.y],"paddle":[paddle.x,paddle.y],"bricks":[[b.x,b.y,b.hidden] for b in bricks],"score":score,"vy":ball_vy})`},{icon:"🐸",name:"青蛙過馬路",goal:"讓青蛙過馬路 3 次。方向、碰撞與得分都由 Python 決定。",tasks:["四方向控制 frog","撞車 -1","撞車後回起點","到終點 +1","到終點後回起點"],lesson:`<b>今天學：把舊知識組起來</b><pre>if key.up:\n    frog.y -= step</pre><p>一個 if 裡可以做很多件事，例如「扣血 + 回起點」。</p>`,hints:["上：y -= step；下：y += step；左：x -= step；右：x += step。","撞車時 life -= 1，然後把 frog.x / frog.y 改回起點。","frog.y < 40 時代表到終點，score += 1，再回起點。"],starter:`score = 0\nlife = 3\nstep = 45\n\ndef move_frog():\n    pass\n\ndef hit_car(car):\n    global life\n    if frog.touched(car):\n        pass\n\ndef goal_check():\n    global score\n    if frog.y < 40:\n        pass\n`,setup:`frog=Sprite(245,350,28,28)\ncars=[Sprite(40,260,56,28),Sprite(330,210,56,28),Sprite(130,160,56,28),Sprite(400,110,56,28)]\ncar_v=[5,-6,5,-7]`,engine:`def __engine_step():\n    move_frog()\n    for i,car in enumerate(cars):\n        car.x += car_v[i]\n        if car.x > 540: car.x=-70\n        if car.x < -70: car.x=540\n        hit_car(car)\n    goal_check()\ndef __state():\n    return json.dumps({"frog":[frog.x,frog.y],"cars":[[c.x,c.y] for c in cars],"score":score,"life":life})`},{icon:"⚔️",name:"雙人對戰",goal:"P1 與 P2 的移動和攻擊條件真的由你的 Python 控制。",tasks:["P1 ← →","P2 A D","P1 ↓ 攻擊","P2 S 攻擊","使用 abs() 判斷距離"],lesson:`<b>今天學：and 與 abs()</b><pre>if key.down and abs(p1.x - p2.x) < 100:\n    p2_life -= damage</pre><p><code>and</code> 表示兩個條件都要成立。</p>`,hints:["先完成 move_players()，兩位玩家各有左右兩個按鍵。","距離：abs(p1.x - p2.x) < 100。","攻擊時要同時檢查按鍵和距離，再扣對方生命。"],starter:`p1_life = 10\np2_life = 10\nspeed = 8\ndamage = 2\n\ndef move_players():\n    pass\n\ndef p1_attack():\n    global p2_life\n    if key.down:\n        pass\n\ndef p2_attack():\n    global p1_life\n    if key.s:\n        pass\n`,setup:`p1=Sprite(90,310,40,45)\np2=Sprite(390,310,40,45)`,engine:`def __engine_step():\n    move_players()\n    p1_attack()\n    p2_attack()\n    p1.x=max(0,min(480,p1.x));p2.x=max(0,min(480,p2.x))\ndef __state():\n    return json.dumps({"p1":[p1.x,p1.y],"p2":[p2.x,p2.y],"p1_life":p1_life,"p2_life":p2_life})`},{icon:"🏰",name:"無限跳塔",goal:"最終 Boss：重力、跳躍、平台重生、雙人控制，全部真的跑 Python。",tasks:["p1_vy / p2_vy 重力","雙人左右控制","踩平台跳起","平台往上","跑出畫面後隨機重生"],lesson:`<b>今天學：重力與跳躍</b><pre>p1_vy += gravity\np1.y += p1_vy</pre><p>跳起來時，把 vy 設成負數，例如 <code>-9</code>。之後 gravity 會慢慢把它拉回正數。</p>`,hints:["重力：P1/P2 都先 vy += gravity，再 y += vy。","踩平台時把 player.y 放到 stair 上面；若是 p1 就改 p1_vy，p2 就改 p2_vy。","平台 y < -20 時，放回 420，x 用 random.randrange()。"],starter:`import random\n\ngravity = 0.3\njump_power = 9\nmove_speed = 8\np1_vy = 0\np2_vy = 0\nfloor = 0\n\ndef update_position():\n    global p1_vy, p2_vy\n    pass\n\ndef touch_stair(player, stair):\n    global p1_vy, p2_vy\n    if player.touched(stair) and player.y < stair.y:\n        pass\n\ndef update_stair(stair):\n    global floor\n    pass\n`,setup:`p1=Sprite(120,250,30,32)\np2=Sprite(330,250,30,32)\nstairs=[]\nfor k in range(8):\n    stairs.append(Sprite(random.randrange(30,400),360-k*55,100,10))`,engine:`def __engine_step():\n    update_position()\n    for stair in stairs:\n        update_stair(stair)\n        touch_stair(p1,stair)\n        touch_stair(p2,stair)\ndef __state():\n    return json.dumps({"p1":[p1.x,p1.y],"p2":[p2.x,p2.y],"stairs":[[s.x,s.y] for s in stairs],"floor":floor,"v1":p1_vy,"v2":p2_vy})`}];
const BOOT=`import json, random, math\nclass Key:\n    right=False; left=False; up=False; down=False\n    a=False; d=False; s=False; w=False; space=False\nkey=Key()\n\nclass Sprite:\n    def __init__(self,x=0,y=0,w=30,h=30):\n        self.x=x; self.y=y; self.w=w; self.h=h; self.hidden=False\n    def touched(self,other):\n        if self.hidden or other.hidden:\n            return False\n        return (self.x < other.x+other.w and self.x+self.w > other.x and\n                self.y < other.y+other.h and self.y+self.h > other.y)\n\ndef __set_keys(d):\n    for name in ["right","left","up","down","a","d","s","w","space"]:\n        setattr(key,name,bool(d.get(name,False)))\n`;
let pyodide=null,loading=null,active=0,editors=[],hintStage=Array(7).fill(0),timer=null,busy=false,state=null,keys={};
const nav=document.getElementById("nav"),main=document.getElementById("main");
LEVELS.forEach((L,i)=>{const b=document.createElement("button");b.textContent=`${i+1}. ${L.icon} ${L.name}`;b.onclick=()=>show(i);nav.appendChild(b);const s=document.createElement("section");s.className="level";s.id="lv"+i;s.innerHTML=`<div class="hero"><h2>${L.icon} ${L.name}</h2><p><b>${L.goal}</b></p>${L.tasks.map((t,j)=>`<div class="task">${j+1}. ${t}</div>`).join("")}<button class="btn learn" onclick="toggleLesson(${i})">📖 今天學什麼</button><div class="lesson hidden" id="lesson${i}">${L.lesson}</div></div><div class="grid"><div class="panel"><h3>⌨️ 真正 Python 編輯器</h3><div class="editor" id="ed${i}"></div><div class="row"><button class="btn run" onclick="runLevel(${i})">▶ 真正執行 Python</button><button class="btn teacher" onclick="teacher(${i})">🤖 小老師</button><button class="btn hint" onclick="hint(${i})">💡 提示</button><button class="btn share" onclick="share(${i})">🔗 分享給我檢查</button><button class="btn reset" onclick="resetCode(${i})">↺ 重設</button></div><div class="save" id="save${i}">💾 已自動儲存 ✓</div><div class="msg" id="msg${i}">這次不是關鍵字檢查。按「真正執行 Python」後，Python 會真的執行你寫的程式。</div><div class="runtime" id="rt${i}">Python 尚未執行。</div></div><div class="panel"><h3>🕹️ Python 執行結果</h3><canvas id="cv${i}" width="520" height="400"></canvas><p class="note">第一次執行會載入 Python，可能需要幾秒。之後會快很多。</p><div class="pad"><button data-k="ArrowLeft">←</button><button data-k="ArrowUp">↑</button><button data-k="ArrowDown">↓</button><button data-k="ArrowRight">→</button><button data-k=" ">🚀</button><button data-k="a">A</button><button data-k="d">D</button><button data-k="s">S</button><button data-k="w">W</button><button data-k="r">R</button></div></div></div>`;main.appendChild(s);const ed=ace.edit("ed"+i);ed.setTheme("ace/theme/tomorrow_night");ed.session.setMode("ace/mode/python");ed.setOptions({fontSize:"15px",showPrintMargin:false,tabSize:4,useSoftTabs:true,wrap:true});ed.session.setTabSize(4);ed.session.setUseSoftTabs(true);ed.setValue(localStorage.getItem("realpy"+i)||L.starter,-1);let st;ed.session. function show(i){active=i;stopGame();document.querySelectorAll(".level").forEach((e,j)=>e.classList.toggle("active",i===j));document.querySelectorAll("nav button").forEach((e,j)=>e.classList.toggle("active",i===j));editors[i].resize();idle(i);scrollTo(0,0)}function toggleLesson(i){document.getElementById("lesson"+i).classList.toggle("hidden")}function say(i,t,k=""){let e=document.getElementById("msg"+i);e.className="msg "+k;e.innerHTML=t}function runtime(i,t){document.getElementById("rt"+i).textContent=t}function hint(i){let n=Math.min(hintStage[i],2);say(i,`💡 提示 ${n+1}/3：${LEVELS[i].hints[n]}`,"warn");hintStage[i]=Math.min(2,hintStage[i]+1)}function teacher(i){const c=editors[i].getValue();if(/\bpass\b/.test(c))say(i,"🤖 我看到還有 pass。pass 的意思是「先什麼都不做」，所以那個任務還沒有完成。可以先按提示。","warn");else say(i,"🤖 最可靠的方法是直接按「真正執行 Python」。如果語法錯，Python 自己會告訴你；如果邏輯錯，右邊遊戲會真的照錯的方式跑。","ok")}function resetCode(i){editors[i].setValue(LEVELS[i].starter,-1);localStorage.removeItem("realpy"+i);hintStage[i]=0;stopGame();say(i,"已重設。先看「今天學什麼」，再一小段一小段完成。","warn");idle(i)}
async function ensurePython(i){if(pyodide)return pyodide;if(loading)return loading;runtime(i,"正在載入真正的 Python…");loading=loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.27.7/full/"}).then(p=>{pyodide=p;return p});return loading}function friendlyError(err){
  const s=String(err);
  // 只認「學生程式」的 traceback 行號，不再顯示 Pyodide / 網站內部的 597 行之類數字。
  const m=s.match(/File ["']<學生程式>["'], line (\d+)/);
  const line=m?Number(m[1]):null;
  const where=line?`（第 ${line} 行）`:"";

  if(s.includes("IndentationError"))
    return `縮排錯誤${where}：看看 if / def 下一行有沒有縮排 4 個空格。`;

  if(s.includes("SyntaxError"))
    return `Python 語法錯誤${where}：檢查冒號 :、括號，以及 += / -= 有沒有寫在一起。`;

  if(s.includes("NameError")){
    const nm=(s.match(/name ["']([^"']+)["'] is not defined/)||[])[1];
    if(nm==="randrange")
      return `找不到 randrange${where}。你前面用了 import random，所以要寫 random.randrange(...)。`;
    return `找不到${nm?`「${nm}」`:"這個名稱"}${where}：可能是拼錯字，或少寫了物件名稱。`;
  }

  if(s.includes("UnboundLocalError"))
    return `這個變數在函式裡被修改${where}，可能需要加 global。`;

  if(s.includes("AttributeError"))
    return `物件沒有你寫的這個屬性${where}。檢查看看 x / y / key 名稱有沒有拼錯。`;

  return `Python 執行時發生錯誤${where}。\n\n`+s.split("\n").slice(-4).join("\n");
}
async function runLevel(i){stopGame();state=null;try{await ensurePython(i);runtime(i,"Python 已載入。正在執行你的程式…");await pyodide.runPythonAsync(BOOT);await pyodide.runPythonAsync(LEVELS[i].setup);pyodide.globals.set("__student_code",editors[i].getValue());await pyodide.runPythonAsync('exec(compile(__student_code, "<學生程式>", "exec"), globals())');await pyodide.runPythonAsync(LEVELS[i].engine);runtime(i,"✅ Python 語法執行成功。現在右邊的遊戲真的由你的程式控制。");say(i,"✅ Python 接受了你的程式。接下來請實際玩看看；如果方向或規則寫錯，遊戲也會跟著錯。","ok");timer=setInterval(()=>step(i),55)}catch(e){runtime(i,"🐛 Python 真正的錯誤：\n"+friendlyError(e));say(i,"🐛 Python 沒有成功執行。先看下面的錯誤訊息；看不懂可以按「小老師」或「提示」。","bad")}}
async function step(i){if(busy||!pyodide||i!==active)return;busy=true;try{const k={right:!!keys.ArrowRight,left:!!keys.ArrowLeft,up:!!keys.ArrowUp,down:!!keys.ArrowDown,a:!!keys.a,d:!!keys.d,s:!!keys.s,w:!!keys.w,space:!!keys[" "]};pyodide.globals.set("__keys_js",JSON.stringify(k));pyodide.runPython(`__set_keys(json.loads(__keys_js))`);pyodide.runPython(`__engine_step()`);const txt=pyodide.runPython(`__state()`);state=JSON.parse(txt);draw(i,state);checkGoal(i,state)}catch(e){stopGame();runtime(i,"🐛 遊戲執行到一半發生 Python 錯誤：\n"+friendlyError(e));say(i,"🐛 程式一開始可以跑，但執行到某個條件時出錯了。這也是很正常的 Bug！","bad")}finally{busy=false}}function stopGame(){if(timer){clearInterval(timer);timer=null}busy=false}
function checkGoal(i,s){if(i===0){if(s.score>=12){win(i)}else if(s.life<=0)lose(i)}if(i===1&&s.life<=0)lose(i);if(i===2&&s.score>=10)win(i);if(i===3&&s.score>=32)win(i);if(i===4){if(s.score>=3)win(i);else if(s.life<=0)lose(i)}if(i===5&&(s.p1_life<=0||s.p2_life<=0))win(i);if(i===6&&s.floor>=20)win(i)}function win(i){stopGame();say(i,"🏆 過關！而且這次真的是你的 Python 把遊戲跑起來的。","ok");runtime(i,"🏆 過關！")}function lose(i){stopGame();say(i,"💥 GAME OVER。程式有成功執行，只是遊戲結果輸了；可以直接再執行一次。","warn")}
function idle(i){let x=document.getElementById("cv"+i).getContext("2d");x.fillStyle="#101827";x.fillRect(0,0,520,400);x.fillStyle="#fff";x.textAlign="center";x.font="bold 28px system-ui";x.fillText(LEVELS[i].icon+" "+LEVELS[i].name,260,180);x.font="16px system-ui";x.fillText("按「真正執行 Python」開始",260,215)}function draw(i,s){let x=document.getElementById("cv"+i).getContext("2d");x.fillStyle="#101827";x.fillRect(0,0,520,400);x.fillStyle="#fff";x.textAlign="left";x.font="bold 17px system-ui";if(i===0){x.fillText(`分數 ${s.score}/12  生命 ${s.life}`,12,24);x.font="30px serif";x.fillText("🧺",s.basket[0],s.basket[1]+28);x.fillText("🍎",s.apple[0],s.apple[1]+28);x.fillText("💣",s.bomb[0],s.bomb[1]+28)}if(i===1){x.fillText(`生命 ${s.life}`,12,24);x.font="38px serif";x.fillText("🚙",s.car[0],s.car[1]+42);s.enemies.forEach(e=>x.fillText("🚗",e[0],e[1]+42))}if(i===2){x.fillText(`分數 ${s.score}/10`,12,24);x.font="34px serif";x.fillText("🚀",s.ship[0],s.ship[1]+30);x.fillText("👾",s.alien[0],s.alien[1]+28);x.fillStyle="#ffd166";x.fillRect(s.bullet[0],s.bullet[1],6,14)}if(i===3){x.fillText(`磚塊 ${s.score}/32`,12,24);s.bricks.forEach((b,j)=>{if(!b[2]){x.fillStyle=`hsl(${j*27%360} 75% 60%)`;x.fillRect(b[0],b[1],52,18)}});x.fillStyle="#fff";x.fillRect(s.paddle[0],s.paddle[1],100,16);x.beginPath();x.arc(s.ball[0]+7,s.ball[1]+7,7,0,7);x.fill()}if(i===4){x.fillText(`過河 ${s.score}/3  生命 ${s.life}`,12,24);x.fillStyle="#2b8a3e";x.fillRect(0,0,520,42);x.fillStyle="#58606b";x.fillRect(0,75,520,250);x.font="30px serif";x.fillText("🐸",s.frog[0],s.frog[1]+28);s.cars.forEach(c=>x.fillText("🚗",c[0],c[1]+28))}if(i===5){x.fillText(`P1 ❤️ ${s.p1_life}   P2 ❤️ ${s.p2_life}`,12,24);x.font="42px serif";x.fillText("🥷",s.p1[0],s.p1[1]+42);x.fillText("🧙",s.p2[0],s.p2[1]+42)}if(i===6){x.fillText(`樓層 ${s.floor}/20`,12,24);x.fillStyle="#98c1d9";s.stairs.forEach(p=>x.fillRect(p[0],p[1],100,10));x.font="30px serif";x.fillText("🧑‍🚀",s.p1[0],s.p1[1]+28);x.fillText("🤖",s.p2[0],s.p2[1]+28)}}
function bytes64(bytes){let z="";bytes.forEach(b=>z+=String.fromCharCode(b));return btoa(z).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/ ,"")}async function share(i){const o={v:2,level:i+1,name:LEVELS[i].name,code:editors[i].getValue()};const u=location.origin+location.pathname+"?review="+bytes64(new TextEncoder().encode(JSON.stringify(o)));try{await navigator.clipboard.writeText(u);say(i,'🔗 已複製分享網址。把它貼到 ChatGPT，我就可以看他實際寫的程式。<div class="url">'+u+"</div>","ok")}catch(e){say(i,'請複製這個網址：<div class="url">'+u+"</div>","ok")}}function loadReview(){let q=new URLSearchParams(location.search).get("review");if(!q)return false;try{q=q.replace(/-/g,"+").replace(/_/g,"/");while(q.length%4)q+="=";const raw=atob(q),arr=Uint8Array.from(raw,c=>c.charCodeAt(0)),o=JSON.parse(new TextDecoder().decode(arr));if(o.level>=1&&o.level<=7){editors[o.level-1].setValue(o.code,-1);show(o.level-1);say(o.level-1,"📥 已載入分享的程式碼。","ok");return true}}catch(e){}return false}
addEventListener("keydown",e=>{if(e.target.closest?.(".ace_editor"))return;keys[e.key]=true;if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault()});addEventListener("keyup",e=>{if(e.target.closest?.(".ace_editor"))return;keys[e.key]=false});document.addEventListener("pointerdown",e=>{const k=e.target.dataset.k;if(k!==undefined){keys[k]=true;e.preventDefault()}});document.addEventListener("pointerup",e=>{const k=e.target.dataset.k;if(k!==undefined){keys[k]=false;e.preventDefault()}});if(!loadReview())show(0);
