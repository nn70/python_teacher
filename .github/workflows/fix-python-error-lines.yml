name: Add advanced Python levels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-python-error-lines.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire advanced levels into index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 載入第 8~12 關資料與額外繪圖/過關邏輯
          anchor='</header>\n<nav id="nav"></nav><main id="main"></main>\n<script>'
          replacement='</header>\n<nav id="nav"></nav><main id="main"></main>\n<script src="extra-levels.js"></script>\n<script>'
          if 'src="extra-levels.js"' not in s:
              if anchor not in s:
                  raise SystemExit('main script anchor not found')
              s=s.replace(anchor,replacement,1)

          # 原本 7 關定義完成後，把進階關卡接進 LEVELS
          marker='];\nconst BOOT=`'
          if 'LEVELS.push(...EXTRA_LEVELS);' not in s:
              pos=s.find(marker)
              if pos < 0:
                  raise SystemExit('LEVELS end marker not found')
              s=s[:pos+2]+'\nLEVELS.push(...EXTRA_LEVELS);'+s[pos+2:]

          # 進階關卡也需要提示階段儲存
          s=s.replace('hintStage=Array(7).fill(0)','hintStage=Array(12).fill(0)')

          # 分享網址允許載入到第 12 關
          s=s.replace('o.level>=1&&o.level<=7','o.level>=1&&o.level<=12')

          # 進階關卡過關條件
          if 'checkExtraGoal(i,s)' not in s:
              old='if(i===6&&s.floor>=20)win(i)}'
              new='if(i===6&&s.floor>=20)win(i);checkExtraGoal(i,s)}'
              if old not in s:
                  raise SystemExit('checkGoal target not found')
              s=s.replace(old,new,1)

          # 讓第 8~12 關有自己的畫面繪製
          if 'drawExtra(i,s,x);' not in s:
              marker='\nfunction bytes64'
              pos=s.find(marker)
              if pos < 0:
                  raise SystemExit('draw end marker not found')
              close=s.rfind('}',0,pos)
              if close < 0:
                  raise SystemExit('draw closing brace not found')
              s=s[:close]+'drawExtra(i,s,x);'+s[close:]

          p.write_text(s,encoding='utf-8')

      - name: Validate JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          for fn in ['extra-levels.js']:
              subprocess.run(['node','--check',fn],check=True)
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          Path('/tmp/site.js').write_text(blocks[-1],encoding='utf-8')
          subprocess.run(['node','--check','/tmp/site.js'],check=True)

      - name: Verify 12 levels are wired
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['extra-levels.js','LEVELS.push(...EXTRA_LEVELS)','Array(12).fill(0)','o.level<=12','checkExtraGoal(i,s)','drawExtra(i,s,x)']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('missing: '+', '.join(missing))

      - name: Commit course expansion
        run: |
          git config user.name "python-teacher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Expand Python course to 12 levels" || exit 0
          git push
