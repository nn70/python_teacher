name: Fix Python student error lines

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-python-error-lines.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 初學者相容：讓 randrange(...) 也能用，但仍保留 random.randrange(...)
          marker = 'const BOOT=`import json, random, math\\n'
          repl = 'const BOOT=`import json, random, math\\nrandrange = random.randrange\\n'
          if 'randrange = random.randrange' not in s:
              if marker not in s:
                  raise SystemExit('BOOT marker not found')
              s = s.replace(marker, repl, 1)

          p.write_text(s, encoding='utf-8')

      - name: Check JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          Path('/tmp/site.js').write_text(blocks[-1],encoding='utf-8')
          subprocess.run(['node','--check','/tmp/site.js'],check=True)

      - name: Commit fix
        run: |
          git config user.name "python-teacher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Allow randrange shorthand for beginners" || exit 0
          git push
